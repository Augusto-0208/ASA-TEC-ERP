<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos | ASA TEC 3D ERP</title>

  <!-- BLOCO FONTS & ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- BLOCO CSS GLOBAL -->
  <link rel="stylesheet" href="../css/global.css" />

  <!-- BLOCO CSS PRODUTOS -->
  <link rel="stylesheet" href="../css/produtos.css" />
</head>

<body>
  <!-- BLOCO LAYOUT PRINCIPAL -->
  <div class="layout">

    <!-- BLOCO SIDEBAR (idêntica à do dashboard) -->
    <aside class="sidebar">
      <div>
        <div class="logo">
          <img src="../assets/logo.png" alt="Logo ASA TEC 3D" class="logo-img" />
          <div>
            <h1>ASA TEC 3D</h1>
            <p>ERP Impressão 3D</p>
          </div>
        </div>

        <nav class="menu">
          <a href="../index.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
          <a href="pedidos.html"><i class="fa-solid fa-box"></i><span>Pedidos</span></a>
          <a href="clientes.html"><i class="fa-solid fa-users"></i><span>Clientes</span></a>
          <a href="produtos.html" class="active"><i class="fa-solid fa-cube"></i><span>Produtos</span></a>
          <a href="estoque.html"><i class="fa-solid fa-layer-group"></i><span>Estoque</span></a>
          <a href="producao.html"><i class="fa-solid fa-print"></i><span>Produção</span></a>
          <a href="financeiro.html"><i class="fa-solid fa-chart-line"></i><span>Financeiro</span></a>
          <a href="relatorios.html"><i class="fa-solid fa-chart-pie"></i><span>Relatórios</span></a>
          <a href="configuracoes.html"><i class="fa-solid fa-gear"></i><span>Configurações</span></a>
          <a href="documentos.html"><i class="fa-solid fa-file-contract"></i><span>Documentos</span></a>
          <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i><span>Login</span></a>
        </nav>
      </div>

      <div class="social">
        <h3>Contatos</h3>
        <a href="#" class="instagram-link"><i class="fa-brands fa-instagram"></i><span>Instagram</span></a>
        <a href="#" class="whatsapp-link"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a>
      </div>
    </aside>

    <!-- BLOCO MAIN -->
    <main class="main">

      <!-- BLOCO HEADER -->
      <section class="page-header">
        <div>
          <h2>Produtos</h2>
          <p>Catálogo completo dos produtos da ASA TEC 3D</p>
        </div>
        <button class="btn-primary" onclick="abrirNovoProduto()">
          <i class="fa-solid fa-plus"></i> Novo Produto
        </button>
      </section>

      <!-- BLOCO TOOLBAR (apenas busca) -->
      <section class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="buscarProduto" placeholder="Buscar produto..." />
        </div>
      </section>

      <!-- BLOCO GRID DE PRODUTOS -->
      <section>
        <div id="listaProdutos" class="produtos-grid"></div>
      </section>

    </main>
  </div>

  <!-- ============================================================
       BLOCO MODAL NOVO PRODUTO
  ============================================================ -->
  <div id="modalNovoProduto" class="modal">
    <div class="modal-content modal-xl">
      <div class="modal-header">
        <div>
          <h2>Novo Produto</h2>
          <p>Cadastro de produto</p>
        </div>
        <button class="btn-close" onclick="fecharNovoProduto()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="formProduto">
        <div class="form-grid">
          <div class="input-group">
            <label>Nome do Produto</label>
            <input type="text" id="nomeProduto" required />
          </div>
          <div class="input-group">
            <label>Preço de Venda</label>
            <input type="number" step="0.01" id="precoVenda" required />
          </div>
          <div class="input-group">
            <label>Preço de Custo</label>
            <input type="number" step="0.01" id="precoCusto" required />
          </div>
          <div class="input-group">
            <label>Material</label>
            <input type="text" id="material" />
          </div>
          <div class="input-group">
            <label>Link STL</label>
            <input type="text" id="linkStl" />
          </div>
          <div class="input-group">
            <label>Foto Produto</label>
            <input type="file" id="fotoProduto" accept="image/*" />
          </div>
        </div>
        <div class="input-group" style="padding: 0 25px 20px;">
          <label>Descrição</label>
          <textarea id="descricaoProduto" rows="3"></textarea>
        </div>
        <div style="padding: 0 25px 25px;">
          <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">
            <i class="fa-solid fa-floppy-disk"></i> Salvar Produto
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       BLOCO MODAL PERFIL PRODUTO
  ============================================================ -->
  <div id="modalProduto" class="modal">
    <div class="modal-content modal-perfil" style="max-width: 900px;">
      <button class="btn-close" onclick="fecharModalProduto()" style="position:absolute; top:20px; right:20px; z-index:10;">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="perfilProduto"></div>
    </div>
  </div>

  <!-- BLOCO SCRIPTS -->
  <script src="../js/database.js"></script>
  <script src="../js/produtos.js"></script>
</body>
</html>
