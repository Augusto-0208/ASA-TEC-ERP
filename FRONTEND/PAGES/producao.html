<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produção | ASA TEC 3D</title>

  <!-- BLOCO FONTS & ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- BLOCO CSS GLOBAL -->
  <link rel="stylesheet" href="../css/global.css" />

  <!-- BLOCO CSS PRODUÇÃO -->
  <link rel="stylesheet" href="../css/producao.css" />
</head>

<body>
  <!-- BLOCO LAYOUT PRINCIPAL -->
  <div class="layout">

    <!-- BLOCO SIDEBAR (idêntica à do dashboard) -->
    <aside class="sidebar">
      <div>
        <div class="logo">
          <img src="../assets/logo.png" alt="Logo ASA TEC 3D" class="logo-img" />
          <div>
            <h1>ASA TEC 3D</h1>
            <p>ERP Impressão 3D</p>
          </div>
        </div>

        <nav class="menu">
          <a href="../index.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
          <a href="pedidos.html"><i class="fa-solid fa-box"></i><span>Pedidos</span></a>
          <a href="clientes.html"><i class="fa-solid fa-users"></i><span>Clientes</span></a>
          <a href="produtos.html"><i class="fa-solid fa-cube"></i><span>Produtos</span></a>
          <a href="estoque.html"><i class="fa-solid fa-layer-group"></i><span>Estoque</span></a>
          <a href="producao.html" class="active"><i class="fa-solid fa-print"></i><span>Produção</span></a>
          <a href="financeiro.html"><i class="fa-solid fa-chart-line"></i><span>Financeiro</span></a>
          <a href="relatorios.html"><i class="fa-solid fa-chart-pie"></i><span>Relatórios</span></a>
          <a href="configuracoes.html"><i class="fa-solid fa-gear"></i><span>Configurações</span></a>
          <a href="documentos.html"><i class="fa-solid fa-file-contract"></i><span>Documentos</span></a>
          <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i><span>Login</span></a>
        </nav>
      </div>

      <div class="social">
        <h3>Contatos</h3>
        <a href="#" class="instagram-link"><i class="fa-brands fa-instagram"></i><span>Instagram</span></a>
        <a href="#" class="whatsapp-link"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a>
      </div>
    </aside>

    <!-- BLOCO MAIN -->
    <main class="main">

      <!-- BLOCO HEADER -->
      <section class="page-header">
        <div>
          <h2>Produção Industrial</h2>
          <p>Controle completo do fluxo de pedidos</p>
        </div>
      </section>

      <!-- BLOCO KANBAN -->
      <section class="kanban">
        <!-- Orçamento -->
        <div class="kanban-column orcamento">
          <h3><i class="fa-solid fa-file-invoice"></i> Orçamento</h3>
          <div id="orcamento"></div>
        </div>

        <!-- Desenvolvimento -->
        <div class="kanban-column desenvolvimento">
          <h3><i class="fa-solid fa-code"></i> Desenvolvimento</h3>
          <div id="desenvolvimento"></div>
        </div>

        <!-- Produção -->
        <div class="kanban-column producao">
          <h3><i class="fa-solid fa-print"></i> Produção</h3>
          <div id="producao"></div>
        </div>

        <!-- Pronto -->
        <div class="kanban-column pronto">
          <h3><i class="fa-solid fa-check-circle"></i> Pronto</h3>
          <div id="pronto"></div>
        </div>

        <!-- Entregue -->
        <div class="kanban-column entregue">
          <h3><i class="fa-solid fa-truck"></i> Entregue</h3>
          <div id="entregue"></div>
        </div>

        <!-- Receber -->
        <div class="kanban-column receber">
          <h3><i class="fa-solid fa-hand-holding-usd"></i> Receber</h3>
          <div id="receber"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- BLOCO SCRIPTS -->
  <script src="../js/database.js"></script>
  <script src="../js/producao.js"></script>
</body>
</html>
